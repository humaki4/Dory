services:
  # MongoDB for general data
  mongodb:
    image: mongo:7
    container_name: dory-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - dory-network

volumes:
  mongodb_data:

networks:
  dory-network:
    driver: bridge
